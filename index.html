<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surprise For Habibti 🌸</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Fredoka', cursive, sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffdde1 0%, #ee9ca7 100%);
      overflow: hidden;
      position: relative;
    }

    /* Floating Flowers Background */
    .flower {
      position: absolute;
      font-size: 2rem;
      user-select: none;
      animation: float 5s ease-in-out infinite alternate;
      opacity: 0.85;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.05));
    }

    .f1 { top: 8%; left: 8%; animation-delay: 0s; }
    .f2 { top: 12%; right: 10%; animation-delay: 0.8s; }
    .f3 { bottom: 25%; left: 10%; animation-delay: 1.5s; }
    .f4 { bottom: 25%; right: 8%; animation-delay: 2.2s; }
    .f5 { top: 48%; left: 3%; animation-delay: 1.2s; }
    .f6 { top: 52%; right: 4%; animation-delay: 0.4s; }
    .f7 { top: 5%; left: 48%; animation-delay: 1.8s; }

    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-18px) rotate(12deg); }
    }

    /* Main Card Container */
    .card-container {
      position: relative;
      background: #ffffff;
      border: 4px solid #ff85a2;
      border-radius: 35px;
      padding: 3rem 2.5rem;
      width: 90%;
      max-width: 460px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(233, 30, 99, 0.2);
      z-index: 10;
    }

    h1 {
      color: #ff3366;
      font-size: 1.8rem;
      margin: 0 0 10px 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .subtitle {
      color: #7a3e5c;
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 25px;
    }

    /* Secret Message Bubble when clicking NO */
    .speech-bubble {
      display: none;
      background: #ffe3ec;
      border: 2px dashed #ff4081;
      color: #d81b60;
      padding: 10px 15px;
      border-radius: 15px;
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 20px;
      animation: popIn 0.3s ease;
    }

    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Buttons Container */
    .buttons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }

    /* Link wrapper styling to prevent text decorations */
    .yes-link {
      text-decoration: none;
      display: inline-block;
    }

    button {
      font-size: 1.3rem;
      font-weight: 700;
      padding: 12px 35px;
      border-radius: 25px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
      box-shadow: 0 5px 15px rgba(0,0,0,0.08);
    }

    .yes-btn {
      background-color: #ff4081;
      color: white;
    }

    .yes-btn:hover {
      background-color: #f50057;
      transform: scale(1.08);
    }

    .no-btn {
      background-color: #f0f0f0;
      color: #777;
    }

    /* Big Running Cat Animation at Bottom */
    .running-cat-container {
      position: absolute;
      bottom: 10px;
      left: -200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 5;
      animation: runAcross 10s linear infinite;
    }

    .running-speech-bubble {
      background: #ffffff;
      border: 3px solid #ff4081;
      color: #d81b60;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 5px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      white-space: nowrap;
    }

    .running-cat-svg {
      width: 140px;
      height: auto;
      filter: drop-shadow(0 6px 8px rgba(0,0,0,0.15));
      animation: bounceCat 0.4s ease-in-out infinite alternate;
    }

    @keyframes runAcross {
      0% {
        left: -200px;
        transform: scaleX(1);
      }
      45% {
        left: calc(100vw + 50px);
        transform: scaleX(1);
      }
      50% {
        left: calc(100vw + 50px);
        transform: scaleX(-1);
      }
      95% {
        left: -200px;
        transform: scaleX(-1);
      }
      100% {
        left: -200px;
        transform: scaleX(1);
      }
    }

    @keyframes bounceCat {
      0% { transform: translateY(0); }
      100% { transform: translateY(-12px); }
    }
  </style>
</head>
<body>

  <!-- Floating Flowers Background -->
  <div class="flower f1">🌸</div>
  <div class="flower f2">🌺</div>
  <div class="flower f3">🌷</div>
  <div class="flower f4">🌹</div>
  <div class="flower f5">🌸</div>
  <div class="flower f6">🌺</div>
  <div class="flower f7">🌷</div>

  <!-- Main Card Container -->
  <div class="card-container">
    <h1>HEY HABIBTI, I MADE A SURPRISE FOR YOU! 💐</h1>
    <div class="subtitle" id="subtitle">Would you like to see it?</div>

    <!-- Hidden Warning Text -->
    <div class="speech-bubble" id="noChoiceBubble">
      Sorry habibti, you got no choice but to click YES! You won't regret it 😉
    </div>

    <!-- Buttons -->
    <div class="buttons">
      <!-- Direct HTML link connection to surprise.html -->
      <a href="suprise.html" class="yes-link">
        <button class="yes-btn" id="yesBtn">YES!</button>
      </a>
      <button class="no-btn" id="noBtn" onclick="handleNo()">NO?</button>
    </div>
  </div>

  <!-- Running Cat at the Background Bottom -->
  <div class="running-cat-container">
    <div class="running-speech-bubble" id="catBubble">You won't regret this! 💕</div>
    <svg class="running-cat-svg" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
      <polygon points="30,45 15,15 45,30" fill="#ffccd5" stroke="#333" stroke-width="3"/>
      <polygon points="90,45 105,15 75,30" fill="#ffccd5" stroke="#333" stroke-width="3"/>
      <polygon points="32,40 22,20 42,30" fill="#ff85a2" />
      <polygon points="88,40 98,20 78,30" fill="#ff85a2" />
      <ellipse cx="60" cy="85" rx="35" ry="30" fill="#ffffff" stroke="#333" stroke-width="3"/>
      <circle cx="60" cy="55" r="35" fill="#ffffff" stroke="#333" stroke-width="3"/>
      <circle cx="45" cy="50" r="5" fill="#333"/>
      <circle cx="75" cy="50" r="5" fill="#333"/>
      <circle cx="47" cy="48" r="2" fill="#fff"/>
      <circle cx="77" cy="48" r="2" fill="#fff"/>
      <ellipse cx="38" cy="58" rx="5" ry="3" fill="#ff85a2" opacity="0.6"/>
      <ellipse cx="82" cy="58" rx="5" ry="3" fill="#ff85a2" opacity="0.6"/>
      <polygon points="58,56 62,56 60,59" fill="#ff85a2"/>
      <path d="M 55 62 Q 60 66 60 62 Q 60 66 65 62" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
      <ellipse cx="45" cy="108" rx="8" ry="5" fill="#ffffff" stroke="#333" stroke-width="3"/>
      <ellipse cx="75" cy="108" rx="8" ry="5" fill="#ffffff" stroke="#333" stroke-width="3"/>
      <ellipse cx="95" cy="65" rx="7" ry="5" fill="#ffffff" stroke="#333" stroke-width="3" transform="rotate(-30 95 65)"/>
    </svg>
  </div>

  <script>
    function handleNo() {
      // Show warning message inside the card
      document.getElementById('noChoiceBubble').style.display = 'block';
      
      // Update running cat speech bubble
      document.getElementById('catBubble').innerText = 'CLICK YES! 💖';
      
      // Make YES button grow bigger
      const yesBtn = document.getElementById('yesBtn');
      const currentSize = parseFloat(window.getComputedStyle(yesBtn).fontSize);
      yesBtn.style.fontSize = (currentSize + 5) + 'px';
      yesBtn.style.padding = (parseFloat(window.getComputedStyle(yesBtn).paddingTop) + 3) + 'px ' + 
                             (parseFloat(window.getComputedStyle(yesBtn).paddingLeft) + 8) + 'px';
    }
  </script>

</body>
</html>
